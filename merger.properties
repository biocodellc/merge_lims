# LabBench Database Merger Configuration
# ========================================

# Source database 1 JDBC URL
db1.url=jdbc:sqlite:/path/to/database1.db

# Source database 2 JDBC URL
db2.url=jdbc:sqlite:/path/to/database2.db

# Target (merged) database JDBC URL
target.url=jdbc:sqlite:/path/to/merged.db

# Database credentials (leave blank for SQLite)
db.username=
db.password=

# MySQL example:
# db1.url=jdbc:mysql://localhost:3306/labbench1
# db2.url=jdbc:mysql://localhost:3306/labbench2
# target.url=jdbc:mysql://localhost:3306/labbench_merged
# db.username=myuser
# db.password=mypass
