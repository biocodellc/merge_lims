# LabBench Database Merger Configuration
# ========================================

# Source database 1
db1.url=jdbc:sqlite:/path/to/database1.db
db1.username=
db1.password=

# Source database 2
db2.url=jdbc:sqlite:/path/to/database2.db
db2.username=
db2.password=

# Target (merged) database
target.url=jdbc:sqlite:/path/to/merged.db
target.username=
target.password=

# Shared credentials (used as fallback when per-database credentials are not set)
# db.username=
# db.password=

# MySQL example:
# db1.url=jdbc:mysql://server1:3306/labbench1
# db1.username=readonly_user
# db1.password=readonly_pass
# db2.url=jdbc:mysql://server2:3306/labbench2
# db2.username=readonly_user
# db2.password=readonly_pass
# target.url=jdbc:mysql://server3:3306/labbench_merged
# target.username=admin_user
# target.password=admin_pass

# Skip schema creation (set to true if target tables already exist)
# skip.schema=false

# Test mode: copy only 10 rows per table (tier 1 and above)
# test.mode=false

# Resume a previously interrupted merge
# resume=false

# Server-side transfer: use INSERT INTO...SELECT for DB1 tables when DB1 and target
# are on the same MySQL server. Much faster as data stays server-side.
# server.side=false

# Server-side transfer for DB2: use INSERT INTO...SELECT with offset arithmetic
# for DB2 tables with simple offsets (gelimages, gel_quantification, assembly, traces,
# sequencing_result). Requires DB2 and target on the same MySQL server.
# server.side.db2=false
